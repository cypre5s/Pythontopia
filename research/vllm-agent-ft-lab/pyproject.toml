[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pythontopia-vllm-agent-ft-lab"
version = "0.1.0"
description = "Offline evaluation and guard tooling for Pythontopia agent fine-tuning experiments."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]
