[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pythontopia-graph"
version = "0.1.0"
description = "Pythontopia multi-agent graph service"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115,<0.116",
  "uvicorn[standard]>=0.34,<0.35",
  "pydantic>=2,<3",
  "langgraph>=0.2,<0.3",
  "httpx>=0.28,<0.29",
  "structlog>=24.4,<25",
  "tenacity>=9,<10",
  "python-dotenv>=1,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.25,<0.26",
  "pytest-cov>=6,<7",
  "ruff>=0.8,<0.9",
  "mypy>=1.14,<2",
]

[tool.setuptools.packages.find]
include = ["pythontopia_graph*"]

[tool.mypy]
strict = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
