[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pythontopia-graph"
version = "0.1.0"
description = "Pythontopia multi-agent graph service"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115,<0.116",
  "uvicorn[standard]>=0.34,<0.35",
  "pydantic>=2,<3",
  # LangGraph v1：核心图 API 与 0.2 兼容（官方迁移指南确认 graph primitives 不变），
  # checkpointer（MemorySaver）一等公民。环境实测 1.1.8 下全量测试绿。
  # https://docs.langchain.com/oss/python/migrate/langgraph-v1
  "langgraph>=1,<2",
  "httpx>=0.28,<0.29",
  "structlog>=24.4,<25",
  "tenacity>=9,<10",
  "python-dotenv>=1,<2",
  # B站视频检索（GPL-3.0-or-later）。GPL 隔离在本 graph 微服务内，后端仅 HTTP 代理，
  # 不进入 Spring / 前端代码层；合规声明见仓库根 LICENSE-ART.md。仅在 routes/video.py
  # 内惰性 import，缺包/无网时应用导入与单测均不受影响。
  "bilibili-api-python>=17.4,<18",
]

[project.optional-dependencies]
# 可观测性（OpenTelemetry GenAI 语义约定）。可选：缺包时 observability 模块全链路降级
# 为 no-op（见 pythontopia_graph/observability/otel.py），故不入核心 dependencies。
# API/SDK 同发布列车，最新稳定版 1.42.1（2026-06 pip index 实测）；<2 锁主版本。
observability = [
  "opentelemetry-api>=1.42,<2",
  "opentelemetry-sdk>=1.42,<2",
]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.25,<0.26",
  "pytest-cov>=6,<7",
  "ruff>=0.8,<0.9",
  "mypy>=1.14,<2",
  # 开发/CI 默认装上 otel，让 observability 的 span 分支测试真正执行而非跳过。
  "pythontopia-graph[observability]",
]

[tool.setuptools.packages.find]
include = ["pythontopia_graph*"]

[tool.mypy]
strict = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
