[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pythontopia-rag"
version = "0.1.0"
description = "Pythontopia courseware RAG service"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.143,<0.144",
  "uvicorn[standard]>=0.34,<0.35",
  "pydantic>=2,<3",
  "httpx>=0.28,<0.29",
  "psycopg[binary]>=3.2,<4",
  "pyarrow>=23.0.1,<24",
  "structlog>=24.4,<25",
  "tenacity>=9,<10",
  "python-dotenv>=1,<2",
]

[project.optional-dependencies]
# KC 知识图谱（GraphRAG 多跳 / 前置扩展，2026-06-17 实测最新稳定版）。optional + lazy-import：
# 缺包时回退既有 expand_prerequisites 字面/向量召回，不影响 /rag/query 主链路。
graph = [
  "networkx>=3,<4",
]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.25,<0.26",
  "pytest-cov>=6,<7",
  "ruff>=0.8,<0.9",
  "mypy>=1.14,<2",
]

[tool.setuptools.packages.find]
include = ["pythontopia_rag*"]

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.parquet"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"
