name: android

on:
  pull_request:
    paths:
      - 'clients/native/android/**'
      - '.github/workflows/android.yml'
  push:
    branches: [main]
    paths:
      - 'clients/native/android/**'
      - '.github/workflows/android.yml'
  release:
    types: [published]

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Make gradlew executable
        working-directory: clients/native/android
        run: chmod +x ./gradlew

      - name: Lint + unit tests + assemble debug
        working-directory: clients/native/android
        run: ./gradlew lintDebug testDebugUnitTest :app:assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: pythontopia-debug-${{ github.sha }}
          path: clients/native/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Upload lint + test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pythontopia-reports-${{ github.sha }}
          path: |
            clients/native/android/app/build/reports/lint-results-*.html
            clients/native/android/app/build/reports/tests/**
          retention-days: 7

  release-build:
    if: github.event_name == 'release' && github.event.action == 'published'
    runs-on: ubuntu-latest
    needs: lint-test-build
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        working-directory: clients/native/android
        run: chmod +x ./gradlew

      - name: Decode signing keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "::error::SIGNING_KEYSTORE_BASE64 secret is not set"
            exit 1
          fi
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > clients/native/android/app/release.keystore

      - name: Assemble release APK + AAB
        working-directory: clients/native/android
        env:
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
        run: ./gradlew :app:assembleRelease :app:bundleRelease --no-daemon

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: pythontopia-release-apk-${{ github.event.release.tag_name }}
          path: clients/native/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 90

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: pythontopia-release-aab-${{ github.event.release.tag_name }}
          path: clients/native/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 90

      - name: Attach artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            clients/native/android/app/build/outputs/apk/release/app-release.apk
            clients/native/android/app/build/outputs/bundle/release/app-release.aab

      - name: Cleanup keystore
        if: always()
        run: rm -f clients/native/android/app/release.keystore
