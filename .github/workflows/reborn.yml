name: Reborn checks
on:
  push:
    branches: [reborn]
  pull_request:
    branches: [reborn]
permissions:
  contents: read
concurrency:
  group: reborn-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm@sha256:858bb5e98eed02eb8cafbcdc007f9a65d1b613972028944a8ec2133ccaf80d27
        env:
          POSTGRES_USER: reborn
          POSTGRES_PASSWORD: ci-only-not-production
          POSTGRES_DB: reborn_ci
          PGUSER: reborn
          PGDATABASE: reborn_ci
        ports: ['5432:5432']
        options: --health-cmd=pg_isready --health-interval=3s --health-timeout=3s --health-retries=20
    env:
      REBORN_DATABASE_URL: postgresql+psycopg://reborn:ci-only-not-production@localhost:5432/reborn_ci
      REBORN_COURSE_ROOT: ${{ github.workspace }}/.tmp/test-course-sources
      REBORN_CONTENT_ROOT: ${{ github.workspace }}/backend/tests/fixtures/teaching-scripts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r backend/requirements.lock
      - run: python backend/tests/source_fixtures.py
      - run: ruff check backend
      - run: pytest backend/tests -q
      - run: alembic upgrade head && PYTHONPATH=tests:. python -m fixture_seed && PYTHONPATH=tests:. python -m fixture_seed
        working-directory: backend
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run typecheck && npm run lint && npm test && npm run build
        working-directory: frontend
  admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - run: npm ci
        working-directory: admin
      - run: npm run typecheck && npm run lint && npm test && npm run build
        working-directory: admin
  browser:
    runs-on: ubuntu-latest
    env:
      REBORN_DATABASE_URL: sqlite:////tmp/reborn-ci.db
      REBORN_STORAGE_ROOT: /tmp/reborn-ci-storage
      REBORN_COURSE_EXCHANGE_ROOT: /tmp/reborn-ci-course-exchange
      REBORN_COURSE_ROOT: ${{ github.workspace }}/.tmp/test-course-sources
      REBORN_CONTENT_ROOT: ${{ github.workspace }}/backend/tests/fixtures/teaching-scripts
      E2E_URL: http://127.0.0.1:15174
      ADMIN_E2E_URL: http://127.0.0.1:15174
      REBORN_E2E_COURSE_PACKAGE: test-python
      E2E_TEACHER_STUDENT_ID: '900001'
      E2E_OTHER_TEACHER_STUDENT_ID: '900002'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r backend/requirements.lock
      - run: python backend/tests/source_fixtures.py
      - run: |
          PYTHONPATH=tests:. python -m fixture_package --source "$REBORN_COURSE_ROOT" --content "$REBORN_CONTENT_ROOT" --output ../.tmp/test-course.zip --package-id "$REBORN_E2E_COURSE_PACKAGE" --name "自动化验收课程"
          python -m zipfile -e ../.tmp/test-course.zip "$REBORN_COURSE_EXCHANGE_ROOT/test-course"
        working-directory: backend
      - run: npm ci && npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm ci
        working-directory: admin
      - name: Generate isolated test credential
        run: |
          reborn_teacher_password=$(openssl rand -hex 24)
          reborn_other_password=$(openssl rand -hex 24)
          echo "::add-mask::$reborn_teacher_password"
          echo "::add-mask::$reborn_other_password"
          echo "E2E_TEACHER_PASSWORD=$reborn_teacher_password" >> "$GITHUB_ENV"
          echo "E2E_OTHER_TEACHER_PASSWORD=$reborn_other_password" >> "$GITHUB_ENV"
      - name: Start isolated native stack
        run: |
          cd backend
          alembic upgrade head
          python -m app.cli provision-user --student-id "$E2E_TEACHER_STUDENT_ID" --role teacher --password-env E2E_TEACHER_PASSWORD
          python -m app.cli provision-user --student-id "$E2E_OTHER_TEACHER_STUDENT_ID" --role teacher --password-env E2E_OTHER_TEACHER_PASSWORD
          python -m uvicorn app.main:app --host 127.0.0.1 --port 18081 --no-access-log > /tmp/reborn-api.log 2>&1 &
          cd ../admin
          npm run dev -- --host 127.0.0.1 > /tmp/reborn-admin.log 2>&1 &
          cd ../frontend
          npm run dev -- --host 127.0.0.1 --port 15174 > /tmp/reborn-web.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:15174/api/health; then exit 0; fi
            sleep 1
          done
          exit 1
      - run: npx playwright test --workers=1
        working-directory: frontend
      - run: npx playwright test --workers=1
        working-directory: admin
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reborn-browser-results
          path: frontend/test-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reborn-admin-browser-results
          path: admin/test-results
