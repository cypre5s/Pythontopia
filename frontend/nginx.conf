server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;
    gzip_vary on;

    location /healthz {
        access_log off;
        add_header Cache-Control "no-store";
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass http://backend:18080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE 加固：关闭代理缓冲与缓存，保证流式响应逐块下发；
        # 读写超时放宽到 300s，避免长对话/生成中途被掐断。
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /v3/api-docs {
        proxy_pass http://backend:18080;
    }

    location /swagger-ui/ {
        proxy_pass http://backend:18080/swagger-ui/;
    }

    # 带内容指纹（hash）的构建产物：JS / CSS / 字体。文件名随内容变更天然失效，
    # 可长期 immutable 强缓存。仅匹配这些后缀，避免误伤 public/ 下未指纹化的静态资源
    # （地图 JSON / 像素 PNG）。缺失即返回 404，绝不回退 index.html ——
    # 否则 .js 请求拿到 text/html 会触发严格 MIME 校验报错（动态导入分块失败的根因）。
    location ~* ^/assets/.+\.(?:js|mjs|css|woff2?)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # index.html 绝不长缓存：每次回源校验（ETag/Last-Modified，命中则 304）。
    # 保证发布新版本后，仍开着旧标签页的用户能拿到最新分块清单，
    # 避免引用到已被替换掉的旧 hash 分块。
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA 前端 history 路由回退：真实文件优先，否则交给 index.html 由前端路由接管。
    location / {
        try_files $uri /index.html;
    }
}
