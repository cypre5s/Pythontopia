map $http_x_forwarded_proto $pythontopia_forwarded_proto {
    # 生产环境由仅监听公网的主机 Nginx 写入该头；容器直连时回退到本层协议。
    # 只接受明确的 http/https，避免把任意客户端输入继续传给 Spring。
    default $scheme;
    ~*^http$ http;
    ~*^https$ https;
}

server {
    listen 80;
    server_name _;
    server_tokens off;
    access_log off;
    client_max_body_size 12m;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;
    gzip_vary on;

    location /healthz {
        access_log off;
        add_header Cache-Control "no-store";
        return 200 "ok\n";
    }

    # Server-side ASR is disabled; cap compatibility uploads before proxy buffering.
    location = /api/media/asr {
        client_max_body_size 1k;
        proxy_pass http://backend:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $pythontopia_forwarded_proto;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # Keep anonymous auth writes bounded before they reach Spring.
    location ~ ^/api/auth/(?:login|refresh|register)$ {
        client_max_body_size 4k;
        proxy_pass http://backend:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $pythontopia_forwarded_proto;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # Keep direct frontend-container requests within the backend snapshot limit too.
    location ~ ^/api/world/saves/[0-9]+/snapshot$ {
        client_max_body_size 256k;
        proxy_pass http://backend:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $pythontopia_forwarded_proto;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # Match Spring's pre-binding limit for browser learning events.
    location = /api/learning/events {
        client_max_body_size 16k;
        proxy_pass http://backend:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $pythontopia_forwarded_proto;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location = /api/events {
        client_max_body_size 16k;
        proxy_pass http://backend:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $pythontopia_forwarded_proto;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location ~ ^/api/internal/tutor/workflow/sessions/[^/]+/autogen-checkpoints/[0-9a-fA-F-]+$ {
        client_max_body_size 3m;
        proxy_pass http://backend:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $pythontopia_forwarded_proto;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location = /api/learning/events/batch {
        client_max_body_size 512k;
        proxy_pass http://backend:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $pythontopia_forwarded_proto;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # Keep Loop Runtime JSON writes within the Spring pre-binding request limit.
    location ~ ^/api/(?:agent-runs/[0-9]+/(?:loop-states|policy-decisions)|loop/runs/[0-9]+/(?:checkpoints|tool-calls|agent-runs|eval-results))$ {
        client_max_body_size 3m;
        proxy_pass http://backend:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $pythontopia_forwarded_proto;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location = /api/workshop/chat-history/turns {
        client_max_body_size 128k;
        proxy_pass http://backend:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $pythontopia_forwarded_proto;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location ~ ^/api/(?:submissions|world/boss/[1-7]/attempt|bug-mine/sessions/[0-9]+/(?:retry-submit|variant-submit))$ {
        client_max_body_size 64k;
        proxy_pass http://backend:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $pythontopia_forwarded_proto;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location /api/ {
        proxy_pass http://backend:18080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $pythontopia_forwarded_proto;
        # SSE 加固：关闭代理缓冲与缓存，保证流式响应逐块下发；
        # 读写超时放宽到 300s，避免长对话/生成中途被掐断。
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /v3/api-docs {
        proxy_pass http://backend:18080;
    }

    location /swagger-ui/ {
        proxy_pass http://backend:18080/swagger-ui/;
    }

    # Pyodide's Emscripten bundle uses eval; keep that permission on its worker only.
    location ~* ^/assets/pyodide\.worker-[^/]+\.js$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self' 'unsafe-eval' 'wasm-unsafe-eval'; connect-src 'self'; worker-src 'self'" always;
        access_log off;
    }

    # 带内容指纹（hash）的构建产物：JS / CSS / 字体。文件名随内容变更天然失效，
    # 可长期 immutable 强缓存。仅匹配这些后缀，避免误伤 public/ 下未指纹化的静态资源
    # （地图 JSON / 像素 PNG）。缺失即返回 404，绝不回退 index.html ——
    # 否则 .js 请求拿到 text/html 会触发严格 MIME 校验报错（动态导入分块失败的根因）。
    location ~* ^/assets/.+\.(?:js|mjs|css|woff2?)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Pyodide 运行时（~10MB，未指纹化但版本固定于 sync 脚本）：长缓存，避免每次访问重下。
    # 升级 Pyodide 版本时 sync-pyodide 会替换文件，配合下方 30 天上限可接受短暂滞后。
    location /pyodide/ {
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # public/ 下未指纹化的静态资源（像素图 / 地图 JSON / 字体）：中等缓存 + 仍带 ETag 兜底校验，
    # 既减少重复下载，又能在发布替换后较快失效。data/ 课程数据不在此列，保留默认回源校验。
    location ~* ^/(assets/pixel|assets/maps|fonts)/.+\.(?:png|jpe?g|webp|gif|svg|json|woff2?|ttf|otf)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }

    # index.html 绝不长缓存：每次回源校验（ETag/Last-Modified，命中则 304）。
    # 保证发布新版本后，仍开着旧标签页的用户能拿到最新分块清单，
    # 避免引用到已被替换掉的旧 hash 分块。
    location = /index.html {
        add_header Cache-Control "no-cache";
        # Only the SPA document needs a resource policy; keep it in the exact response
        # location because its Cache-Control header overrides parent add_header inheritance.
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; frame-ancestors 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.hdslb.com; font-src 'self'; connect-src 'self'; worker-src 'self'; frame-src 'none'; media-src 'self'; manifest-src 'self'" always;
    }

    # SPA 前端 history 路由回退：真实文件优先，否则交给 index.html 由前端路由接管。
    location / {
        try_files $uri /index.html;
    }
}
