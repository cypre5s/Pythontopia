[project]
name = "pythontopia-reborn-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = ["fastapi", "uvicorn", "sqlalchemy>=2,<3", "alembic", "psycopg[binary]", "pydantic>=2", "python-multipart", "httpx", "langchain", "langchain-openai", "pypdf", "boto3", "PyYAML>=6.0.3,<7", "openpyxl>=3.1,<4", "defusedxml>=0.7,<1", "Pillow>=12.3,<14"]

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy"]

[tool.mypy]
# 只对讲解包做严格检查：其他模块尚未注解，全量打开会淹没真问题。
python_version = "3.12"
files = ["app/narration"]
follow_imports = "silent"
ignore_missing_imports = true
disallow_untyped_defs = true
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
no_implicit_optional = true
strict_equality = true

[tool.ruff]
line-length = 150

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
