# Automated regression fixture only; never loaded by the running service.
schema_version: 1
id: first-steps
chapter_id: 179
quest:
  id: arrival
  title: 初来小镇：第一堂 Python 课
  chapter_id: 179
  kind: main
  nodes:
  - id: welcome
    title: 前往广场，拜访镇长
    type: PLAY_DIALOGUE
    target: mayor_py
    navigation_target: mayor_py
    dependencies: []
    dialogue_id: story:first-steps:welcome
  - id: meet-librarian
    title: 进入图书馆，拜访图书管理员
    type: PLAY_DIALOGUE
    target: librarian_doc
    navigation_target: librarian_doc
    dependencies:
    - welcome
    dialogue_id: story:first-steps:meet-librarian
  - id: study
    title: 阅读第一章：计算、抽象与问题求解
    type: STUDY_LESSON
    target: librarian_doc
    navigation_target: librarian_doc
    dependencies:
    - meet-librarian
    activity_id: ch1-lesson
  - id: meet-mentor
    title: 前往东侧练习场，拜访教练
    type: PLAY_DIALOGUE
    target: arena_guard
    navigation_target: arena_guard
    dependencies:
    - study
    dialogue_id: story:first-steps:meet-mentor
  - id: practice
    title: 完成计算思维练习
    type: COMPLETE_PRACTICE
    target: arena_guard
    navigation_target: arena_guard
    dependencies:
    - meet-mentor
    activity_id: ch1-practice
  - id: meet-assessment
    title: 回到镇长身边，领取章节测试
    type: PLAY_DIALOGUE
    target: mayor_py
    navigation_target: mayor_py
    dependencies:
    - practice
    dialogue_id: story:first-steps:meet-assessment
  - id: assessment
    title: 完成第一章章节测试
    type: PASS_ASSESSMENT
    target: mayor_py
    navigation_target: mayor_py
    dependencies:
    - meet-assessment
    activity_id: ch1-assessment
  - id: report
    title: 听取镇长的章节总结
    type: PLAY_DIALOGUE
    target: mayor_py
    navigation_target: mayor_py
    dependencies:
    - assessment
    dialogue_id: story:first-steps:report
  effects: []
story:
  schema_version: 1
  bindings:
    lesson:
      activity_id: ch1-lesson
      goal_id: study
    practice:
      activity_id: ch1-practice
      goal_id: practice
    assessment:
      activity_id: ch1-assessment
      goal_id: assessment
  entries:
    mayor_py:
    - when:
        goal_complete: report
      node: mayor-done
    - when:
        goal_ready: report
      node: mayor-pass
    - when:
        goal_ready: assessment
      node: mayor-exam-return
    - when:
        goal_ready: meet-assessment
      node: mayor-exam-first
    - when:
        goal_complete: study
      node: mayor-study-reminder
    - when:
        goal_complete: welcome
      node: mayor-reminder
    - when:
        always: true
      node: mayor-first
    librarian_doc:
    - when:
        goal_complete: study
      node: librarian-referral
    - when:
        activity_started: lesson
      node: librarian-return
    - when:
        goal_complete: meet-librarian
      node: librarian-ready
    - when:
        goal_ready: meet-librarian
      node: librarian-first
    - when:
        always: true
      node: librarian-locked
    arena_guard:
    - when:
        goal_complete: practice
      node: mentor-success
    - when:
        goal_ready: practice
      node: mentor-return
    - when:
        goal_ready: meet-mentor
      node: mentor-first
    - when:
        always: true
      node: mentor-locked
  nodes:
  - id: mayor-first
    type: dialogue
    speaker: 镇长 Py
    text: 欢迎来到 Pythontopia！我是镇长 Py。听说你也想探索这座小镇里的奥秘。
    next: mayor-welcome
  - id: mayor-welcome
    type: dialogue
    speaker: 镇长 Py
    text: 这里的人用 Python 描述规则、解决问题。不过，认识一种语言，要先理解计算与思考的方法。图书馆保存着第一章的资料，去找图书管理员吧。
    next: end
    checkpoint: welcome
  - id: mayor-reminder
    type: dialogue
    speaker: 镇长 Py
    text: 去找图书管理员吧，就在西侧的图书馆那边。她已经为你准备好第一章的资料了。
    next: end
  - id: mayor-study-reminder
    type: dialogue
    speaker: 镇长 Py
    text: 读完指定资料后，可以到东侧练习场找教练试试身手。准备好了再回来，我会为你安排章节测试。
    next: end
  - id: mayor-exam-first
    type: dialogue
    speaker: 镇长 Py
    text: 教练已经把你的练习情况告诉我了。接下来用一组独立的章节测试，检验你对计算思维的理解。
    next: mayor-exam-invite
  - id: mayor-exam-invite
    type: dialogue
    speaker: 镇长 Py
    text: 测试依据第一章的真实资料。你可以认真思考后提交；如果还不确定，也可以先回去复习。准备好了吗？
    choices:
    - id: start
      label: 开始章节测试
      next: open-assessment
    - id: later
      label: 先去复习
      next: end
    checkpoint: meet-assessment
  - id: mayor-exam-return
    type: dialogue
    speaker: 镇长 Py
    text: 准备好继续章节测试了吗？之前的作答已经保留。
    choices:
    - id: continue
      label: 继续章节测试
      next: open-assessment
    - id: later
      label: 稍后再来
      next: end
  - id: mayor-exam-pause
    type: dialogue
    speaker: 镇长 Py
    text: 先整理一下思路吧。你的作答记录会保留，随时可以回来继续。
    next: end
  - id: mayor-pass
    type: dialogue
    speaker: 镇长 Py
    text: 做得好！你已经完成了学习、练习与章节测试。第一章已经完成，接下来我们会继续探索 Python 与程序设计语言。
    next: mayor-score
    checkpoint: report
  - id: mayor-score
    type: branch
    routes:
    - when:
        assessment_score: {activity_id: ch1-assessment, min: 100, max: 100}
      node: mayor-score-excellent
    - when:
        assessment_score: {activity_id: ch1-assessment, min: 60, max: 99}
      node: mayor-score-good
    - when:
        assessment_score: {activity_id: ch1-assessment, min: 0, max: 59}
      node: mayor-score-encourage
    - when: {always: true}
      node: mayor-done
  - id: mayor-score-excellent
    type: dialogue
    speaker: 镇长 Py
    text: 这次测试拿到了满分！你已经把计算思维的基础掌握得很扎实了。带着这份好奇心，继续探索吧。
    next: end
  - id: mayor-score-good
    type: dialogue
    speaker: 镇长 Py
    text: 你已经理解了不少关键方法。回头看看测试里还不熟悉的地方，继续巩固，下一段旅程会更从容。
    next: end
  - id: mayor-score-encourage
    type: dialogue
    speaker: 镇长 Py
    text: 第一次学习有些疑问很正常，慢慢来。去图书馆再读一读，在练习场试着改正错误，我们会陪着你把这些方法弄明白。
    next: end
  - id: mayor-done
    type: dialogue
    speaker: 镇长 Py
    text: 欢迎回来！第一章已经完成。资料和练习仍然保留着，需要时可以回去复习。
    next: end
  - id: mayor-unavailable
    type: dialogue
    speaker: 镇长 Py
    text: 测试暂时无法打开。请稍后再试，已有的学习和成绩记录都会保留。
    next: end
  - id: librarian-first
    type: dialogue
    speaker: 图书管理员
    text: 镇长说会有一位新来的冒险家。欢迎来到图书馆，我是这里的管理员。
    next: librarian-invite
  - id: librarian-invite
    type: dialogue
    speaker: 图书管理员
    text: 这份资料讲述计算工具与计算思维。先关注第34、42、43页：什么是计算、抽象与自动化，以及如何求解问题。阅读时有疑问，可以在旁边向我提问。
    choices:
    - id: read
      label: 现在开始阅读
      next: open-lesson
    - id: later
      label: 稍后再来
      next: end
    checkpoint: meet-librarian
  - id: librarian-ready
    type: dialogue
    speaker: 图书管理员
    text: 第一章资料已经准备好了。要现在开始阅读吗？先关注第34、42、43页，其余内容也可以自由查阅。
    choices:
    - id: read
      label: 现在开始阅读
      next: open-lesson
    - id: later
      label: 稍后再来
      next: end
  - id: librarian-return
    type: dialogue
    speaker: 图书管理员
    text: 你回来啦。上次的阅读位置已经记下了，要继续阅读吗？
    choices:
    - id: continue
      label: 继续阅读
      next: open-lesson
    - id: later
      label: 稍后再来
      next: end
  - id: librarian-pause
    type: dialogue
    speaker: 图书管理员
    text: 要去忙别的了？没关系，你的阅读位置已经保存，随时可以回来看看。
    next: end
  - id: librarian-referral
    type: dialogue
    speaker: 图书管理员
    text: 指定资料已经留下阅读记录了。东侧练习场的教练研究这些方法很久了，去和他做些练习吧。阅读只是开始，运用知识才能发现自己是否理解。
    next: end
  - id: librarian-locked
    type: dialogue
    speaker: 图书管理员
    text: 欢迎来图书馆。先去广场和镇长聊聊，他会向你介绍这次学习旅程。
    next: end
  - id: librarian-unavailable
    type: dialogue
    speaker: 图书管理员
    text: 这份资料暂时无法打开。请稍后再来，我会保留你的阅读记录。
    next: end
  - id: mentor-first
    type: dialogue
    speaker: 练习场教练
    text: 管理员让你来的吧？我在这里练习把问题拆成规则，再一步步解决。先用几道概念题热热身。
    next: mentor-invite
  - id: mentor-invite
    type: dialogue
    speaker: 练习场教练
    text: 别急着猜答案，想想资料里的计算、抽象和建模。提交后会得到反馈，也可以重试。
    choices:
    - id: start
      label: 开始练习
      next: open-practice
    - id: later
      label: 稍后再来
      next: end
    checkpoint: meet-mentor
  - id: mentor-return
    type: dialogue
    speaker: 练习场教练
    text: 回来继续练习吧。已经通过的题目和未完成的作答都会保留。
    choices:
    - id: continue
      label: 继续练习
      next: open-practice
    - id: later
      label: 稍后再来
      next: end
  - id: mentor-pause
    type: dialogue
    speaker: 练习场教练
    text: 先歇一歇也好。整理好思路，再回来继续练习。
    next: end
  - id: mentor-success
    type: dialogue
    speaker: 练习场教练
    text: 这组练习已经完成了！回镇长那里参加章节测试吧，他正等着听你的进展。
    next: end
  - id: mentor-locked
    type: dialogue
    speaker: 练习场教练
    text: 先去图书馆完成第一章的指定阅读，理解这些方法之后再来练习。
    next: end
  - id: mentor-unavailable
    type: dialogue
    speaker: 练习场教练
    text: 练习暂时无法打开，请稍后再试。已有作答会保留。
    next: end
  - id: open-lesson
    type: activity
    binding: lesson
    returns:
      completed: librarian-referral
      suspended: librarian-pause
      unavailable: librarian-unavailable
  - id: open-practice
    type: activity
    binding: practice
    returns:
      completed: mentor-success
      suspended: mentor-pause
      unavailable: mentor-unavailable
  - id: open-assessment
    type: activity
    binding: assessment
    returns:
      completed: mayor-pass
      suspended: mayor-exam-pause
      unavailable: mayor-unavailable
  - id: end
    type: end
  checkpoint_effects:
    welcome:
    - type: set_world_flag
      key: library_unlocked
