spring:
  profiles:
    active: local
  datasource:
    url: ${PYT_DB_URL}
    username: ${PYT_DB_USERNAME}
    password: ${PYT_DB_PASSWORD}
  flyway:
    locations: classpath:db/migration
    baseline-on-migrate: false
  jpa:
    open-in-view: false
  servlet:
    multipart:
      # 随身助教语音输入回退（/api/media/asr）上传短录音；放宽到 8MB 容纳 ~60s 录音，余量足够。
      max-file-size: 8MB
      max-request-size: 12MB

server:
  port: 18080
  # 生产流量经过主机 Nginx 与前端容器 Nginx 两层代理。让 Spring 用可信转发头
  # 还原公网 scheme/host，避免 HTTPS 同源请求被误判为跨域而拒绝登录。
  forward-headers-strategy: framework

pythontopia:
  ai:
    request-limits:
      # Deployment keeps the account and provider daily caps; ./dev.sh opts local iteration out.
      enabled: ${PYT_AI_REQUEST_LIMITS_ENABLED:true}
  judge:
    # 不可信学生代码默认交给独立 Piston/Isolate；未配置服务时判题 fail closed。
    provider: ${PYT_JUDGE_PROVIDER:piston}
    # AST 语法检查器使用的 Python 解释器（不运行学生提交）。
    python: ${PYT_JUDGE_PYTHON:python3}
    piston:
      base-url: ${PYT_PISTON_URL:}
      python-version: ${PYT_PISTON_PYTHON_VERSION:3.11.13}
      auth-token: ${PYT_PISTON_AUTH_TOKEN:}
      connect-timeout-ms: ${PYT_PISTON_CONNECT_TIMEOUT_MS:3000}
      read-timeout-ms: ${PYT_PISTON_READ_TIMEOUT_MS:10000}
  services:
    graphUrl: ${PYT_GRAPH_URL:http://localhost:18091}
    ragUrl: ${PYT_RAG_URL:http://localhost:18092}
    ragAdminToken: ${PYT_RAG_ADMIN_TOKEN:}
  workshop-routing:
    # 独立于 graph/rag internal token；留空时多 Agent 执行 fail closed。
    executionSecret: ${PYT_ROUTE_EXECUTION_SECRET:}
  http:
    graph:
      # graphRestTemplate 超时（毫秒）：下游不可达时在阈值内 fail-fast，避免占满 Tomcat 线程。
      connect-timeout-ms: ${PYT_GRAPH_CONNECT_TIMEOUT_MS:3000}
      read-timeout-ms: ${PYT_GRAPH_READ_TIMEOUT_MS:30000}
    browse:
      # Graph 浏览最多 45 秒，关闭浏览器最多再用 3 秒；避免默认 30 秒在有效结果返回前误报超时。
      read-timeout-ms: ${PYT_BROWSE_READ_TIMEOUT_MS:50000}
    feynman-tutee:
      # AI 学弟需同步产出误区更新与可判题代码，独立于普通 Graph 的 30s 快速请求窗口。
      read-timeout-ms: ${PYT_FEYNMAN_TUTEE_READ_TIMEOUT_MS:90000}
    workshop:
      # 资源图包含检索、结构化设计与语义接地审查，独立于普通 Graph 的 30s 快速请求窗口。
      read-timeout-ms: ${PYT_WORKSHOP_READ_TIMEOUT_MS:180000}
    chapter-test:
      read-timeout-ms: ${PYT_CHAPTER_TEST_READ_TIMEOUT_MS:600000}
    boss-problem:
      read-timeout-ms: ${PYT_BOSS_PROBLEM_READ_TIMEOUT_MS:180000}
  sse:
    relay:
      # SSE 中继线程池：有界 + CallerRunsPolicy，突发流量回压而非打满线程/OOM。
      core-pool-size: ${PYT_SSE_RELAY_CORE:4}
      max-pool-size: ${PYT_SSE_RELAY_MAX:16}
      queue-capacity: ${PYT_SSE_RELAY_QUEUE:200}
  security:
    teacherInviteCode: ${PYT_TEACHER_INVITE_CODE:}
    # 允许的精确前端来源。逗号分隔；生产用 PYT_CORS_ALLOWED_ORIGINS 覆盖为真实域名。
    cors:
      allowed-origins: ${PYT_CORS_ALLOWED_ORIGINS:http://localhost:8080,http://127.0.0.1:8080,http://localhost:5173,http://localhost:5174,http://127.0.0.1:5173,http://127.0.0.1:5174}
    # 是否公开 OpenAPI/Swagger UI。dev=true 便于联调；生产设 PYT_EXPOSE_API_DOCS=false 后
    # 这些端点改为需鉴权访问，避免对公网泄露完整 API 面。
    expose-api-docs: ${PYT_EXPOSE_API_DOCS:true}
    jwt:
      secret: ${PYT_JWT_SECRET:}
      ttlMinutes: 720
  mastery:
    halfLifeDays: 14
    confidenceGainPerEvent: 0.05
    confidenceLossPerDecay: 0.02
    deltas:
      RESOURCE_READ: 0.10
      MICRO_CHECK_PASS: 0.08
      MICRO_CHECK_FAIL: -0.02
      PRACTICE_PASS: 0.20
      PRACTICE_FAIL: -0.05
      DEBUG_FIX: 0.15
      MANUAL_OVERRIDE: 0.00
      DECAY: 0.00
      BOOTSTRAP: 0.00
  workshop:
    maxResourcesPerHour: 10
    masteryDailyCapPerKc: 0.15
    allowlist: []
  media:
    # 仅供旧媒体资产读取；AI 图片生成和配音入口保持关闭。
    generatedDir: ${PYT_MEDIA_GENERATED_DIR:./data/course-pack-43/generated-media}
    compose:
      # 旧故事板任务的队列参数；其讯飞图片/语音 provider 固定关闭，不会发出上游请求。
      poolSize: ${PYT_MEDIA_COMPOSE_POOL:3}
      ttiConcurrency: ${PYT_MEDIA_COMPOSE_TTI_CONCURRENCY:2}
      ttsConcurrency: ${PYT_MEDIA_COMPOSE_TTS_CONCURRENCY:2}
      queueCapacity: ${PYT_MEDIA_COMPOSE_QUEUE:64}
      streamTimeoutMs: ${PYT_MEDIA_COMPOSE_STREAM_TIMEOUT_MS:300000}
  npc:
    greeting:
      prewarm:
        # NPC 寒暄「每日预生成」：每天定时为活跃学生×核心 NPC 预热寒暄缓存，玩家进对话零等待、一天一更新。
        # enabled=false 关闭（回退实时生成）；cron 默认凌晨 3:30；只覆盖最近 active-days 天活跃、至多 max-users 个学生。
        enabled: ${PYT_NPC_GREETING_PREWARM_ENABLED:true}
        cron: ${PYT_NPC_GREETING_PREWARM_CRON:0 30 3 * * *}
        active-days: ${PYT_NPC_GREETING_PREWARM_ACTIVE_DAYS:7}
        max-users: ${PYT_NPC_GREETING_PREWARM_MAX_USERS:200}
  coursepack:
    # R-13 D1/D2：原 PDF 本地路径（不进 git）。文件命名 {documentId}.pdf（186~192）。
    # 来源：Alethicode/deploy/data/language_pack/tasks/31/originals 的 7 章 PDF
    # （第一~第七章），首次部署需 cp 进来，路径与 Pythontopia/data/course-pack-43/pdfs/ 对应。
    # 后端通过 /api/course/documents/{docId}/pdf 流式分发给 pdfjs-dist 渲染。
    pdfDir: ${PYT_COURSEPACK_PDF_DIR:./data/course-pack-43/pdfs}
    # R-12 Phase 2：超星任务点视频本地缓存目录（不进 git，见 .gitignore；由
    # crawl_chaoxing_videos.py 下载到此）。后端通过 /api/course/videos/{id} 支持 Range 流式分发。
    videoDir: ${PYT_COURSEPACK_VIDEO_DIR:./data/course-pack-43/videos}
    # 视频清单（入库；空数组表示当前课程无任务点视频）。由 crawl_chaoxing_videos.py 生成/维护。
    videoManifest: ${PYT_COURSEPACK_VIDEO_MANIFEST:./data/course-pack-43/video_manifest.json}
    # 由 transcribe_videos.py 使用 faster-whisper 从真实 MP4 生成；看课页答疑按播放时刻读取。
    videoTranscripts: ${PYT_COURSEPACK_VIDEO_TRANSCRIPTS:./data/course-pack-43/video_transcripts.json}
