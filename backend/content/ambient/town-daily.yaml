schema_version: 1
id: town-daily
chapter_id: 179
story:
  schema_version: 1
  mode: ambient
  when:
    quest: {id: arrival, status: complete}
  bindings: {}
  entries:
    mayor_py:
    - when: {always: true}
      node: mayor-daily-menu
    librarian_doc:
    - when: {always: true}
      node: librarian-daily-menu
    arena_guard:
    - when: {always: true}
      node: mentor-daily-menu
    professor:
    - when: {always: true}
      node: professor-daily-menu
  nodes:
  - id: mayor-daily-menu
    type: dialogue
    speaker: 镇长 Py
    text: 欢迎回来！今天想聊些什么？小镇里的日子，也有许多值得观察的小事。
    choices:
    - id: town-life
      label: 聊聊小镇近况
      next: mayor-daily-random
    - id: first-lesson
      label: 聊聊第一堂课
      when: {chapter: {id: 179, status: complete}}
      next: mayor-daily-lesson
    - id: next-chapter
      label: 接下来的学习有什么？
      when: {chapter: {id: 180, status: available}}
      next: mayor-daily-next
    - id: goodbye
      label: 先去逛逛
      next: end
  - id: mayor-daily-random
    type: random
    next: [mayor-daily-fountain, mayor-daily-path]
  - id: mayor-daily-fountain
    type: dialogue
    speaker: 镇长 Py
    text: 广场的喷泉每天都按同一套节奏喷水。把规则写清楚，简单的动作也能组成有趣的变化。
    next: end
  - id: mayor-daily-path
    type: dialogue
    speaker: 镇长 Py
    text: 我常沿着广场散步，看看大家有没有遇到困难。有时换一条路，就会注意到之前忽略的细节。
    next: end
  - id: mayor-daily-lesson
    type: dialogue
    speaker: 镇长 Py
    text: 第一堂课已经走完了。你觉得最有意思的是哪一种思考方法？带着自己的问题回看资料，常常会有新的发现。
    next: end
  - id: mayor-daily-next
    type: dialogue
    speaker: 镇长 Py
    text: 班级已经开放了下一章资料。想知道接下来学什么，可以去小镇图书馆看看；新的主线委托要等正式安排。
    next: end
  - id: librarian-daily-menu
    type: dialogue
    speaker: 图书管理员
    text: 今天也欢迎来图书馆。想安静翻书，还是和我聊一会儿？
    choices:
    - id: town-life
      label: 聊聊图书馆
      next: librarian-daily-random
    - id: first-lesson
      label: 聊聊学过的资料
      when: {chapter: {id: 179, status: complete}}
      next: librarian-daily-lesson
    - id: goodbye
      label: 我去看看书
      next: end
  - id: librarian-daily-random
    type: random
    next: [librarian-daily-books, librarian-daily-window]
  - id: librarian-daily-books
    type: dialogue
    speaker: 图书管理员
    text: 给书分类很像抽象：先挑出你关心的特征，再把相似的书放到一起。换一种目的，也可以换一种分类方法。
    next: end
  - id: librarian-daily-window
    type: dialogue
    speaker: 图书管理员
    text: 靠窗的位置很适合慢慢读书。看到暂时不懂的地方，可以先记下问题，读过后面的内容再回来看看。
    next: end
  - id: librarian-daily-lesson
    type: dialogue
    speaker: 图书管理员
    text: 学过的资料一直都在。复习时不必只从第一页开始，带着一个具体问题去找对应内容，往往更容易读进去。
    next: end
  - id: mentor-daily-menu
    type: dialogue
    speaker: 练习场教练
    text: 来得正好！今天想聊练习的方法，还是听听练习场的小事？
    choices:
    - id: town-life
      label: 随便聊聊
      next: mentor-daily-random
    - id: first-lesson
      label: 怎么继续巩固？
      when: {chapter: {id: 179, status: complete}}
      next: mentor-daily-lesson
    - id: goodbye
      label: 我再去走走
      next: end
  - id: mentor-daily-random
    type: random
    next: [mentor-daily-steps, mentor-daily-rest]
  - id: mentor-daily-steps
    type: dialogue
    speaker: 练习场教练
    text: 遇到复杂的问题，我会先找一个足够小的例子。把它一步步走通，比一开始就追求最快的办法更有帮助。
    next: end
  - id: mentor-daily-rest
    type: dialogue
    speaker: 练习场教练
    text: 练习也要留点休息的时间。有些卡住的地方，起身走一圈再回来，反而能看到新的思路。
    next: end
  - id: mentor-daily-lesson
    type: dialogue
    speaker: 练习场教练
    text: 试着用自己的话解释一道题，再换个例子检验它。发现错误也别急，能说清楚为什么错，就是在前进。
    next: end
  - id: professor-daily-menu
    type: dialogue
    speaker: 林教授
    text: 又见面了。观察、提问、尝试，小镇里到处都有值得琢磨的事情。
    choices:
    - id: town-life
      label: 听听教授的见闻
      next: professor-daily-random
    - id: next-chapter
      label: 聊聊下一章
      when: {chapter: {id: 180, status: available}}
      next: professor-daily-next
    - id: goodbye
      label: 下次再聊
      next: end
  - id: professor-daily-random
    type: random
    next: [professor-daily-question, professor-daily-rule]
  - id: professor-daily-question
    type: dialogue
    speaker: 林教授
    text: 好问题常常从一句“为什么”开始。把自己的猜想写下来，再想办法验证它，日常观察也能变成一次探索。
    next: end
  - id: professor-daily-rule
    type: dialogue
    speaker: 林教授
    text: 同一件事情可以有不同的描述方法。选择合适的表达，能让复杂的问题更清楚，也方便与别人讨论。
    next: end
  - id: professor-daily-next
    type: dialogue
    speaker: 林教授
    text: 下一章的资料已经开放，可以先看看目录，带着问题阅读。小镇的主线安排仍以任务日志里的委托为准。
    next: end
  - id: end
    type: end
