schema_version: 1
npcs:
- key: mayor_py
  name: 镇长 Py
  map_key: town_hub
  tile_x: 22
  tile_y: 34
  portrait: /assets/pixel/portraits/galgame/mayor_py.png
  dialogue:
  - id: welcome
    text: 欢迎来到 Pythontopia！小镇图书馆等待你的计算思维重新点亮。
    next: welcome-story
    speaker: 镇长 Py
  - id: welcome-story
    speaker: 镇长 Py
    text: 先读计算思维课件，再到东侧练习场。完成练习后回来汇报，我们一起点亮图书馆。
    once: opening-letter
- key: professor
  name: 林教授
  map_key: town_hub
  tile_x: 25
  tile_y: 14
  portrait: /assets/pixel/portraits/galgame/professor.png
  dialogue:
  - id: language
    speaker: 林教授
    text: 语言连接思想与机器。先读课件，再决定探索路线。
    choices:
    - id: concept
      label: 辨认程序设计语言
      next: concept-path
    - id: code
      label: 补学输入输出并编程
      next: code-path
  - id: concept-path
    speaker: 林教授
    text: 到练习场辨认语言，再去图书馆寻找馆员和西侧书架。
  - id: code-path
    speaker: 林教授
    text: 先阅读输入输出与圆面积相关页，再正式提交圆面积题目。
- key: arena_guard
  name: 练习场教练
  map_key: town_hub
  tile_x: 38
  tile_y: 24
  portrait: /assets/pixel/portraits/galgame/arena_guard.png
  dialogue:
  - id: practice
    text: 正式提交会记录成绩，练习可以重试。
- key: librarian_doc
  name: 图书管理员
  map_key: library
  tile_x: 9
  tile_y: 5
  portrait: /assets/pixel/portraits/galgame/librarian_doc.png
  dialogue:
  - id: books
    text: 书架记录语言的历史。阅读参与和掌握知识是两回事。
