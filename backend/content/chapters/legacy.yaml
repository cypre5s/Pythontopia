quests:
- id: arrival
  version: 1
  title: 第一束灯：计算思维的来信
  chapter_id: 179
  kind: main
  nodes:
  - id: greet
    type: TALK_TO_NPC
    title: 在南侧广场找到镇长 Py
    target: mayor_py
    dependencies: []
  - id: opening
    type: PLAY_DIALOGUE
    title: 听完图书馆的来信
    target: mayor_py
    dependencies:
    - greet
    dialogue_id: welcome
  - id: study
    type: STUDY_LESSON
    title: 阅读计算工具与计算思维
    dependencies:
    - opening
    activity_id: ch1-lesson
    activity_version: 1
  - id: reach-practice
    type: REACH_LOCATION
    title: 前往东侧练习场
    target: practice_plaza
    dependencies:
    - study
  - id: practice
    type: COMPLETE_PRACTICE
    title: 完成计算思维概念题
    dependencies:
    - reach-practice
    activity_id: ch1-practice
    activity_version: 1
  - id: report
    type: REPORT_BACK
    title: 向镇长汇报，点亮图书馆
    target: mayor_py
    dependencies:
    - practice
  effects:
  - type: set_world_flag
    key: library_unlocked
  - type: set_world_flag
    key: town_light_restored
- id: lost-language
  version: 1
  title: 失落的语言：寻找思想与机器的桥梁
  chapter_id: 180
  kind: main
  nodes:
  - id: mission
    type: TALK_TO_NPC
    title: 领取寻找失落知识的委托
    target: mayor_py
    dependencies: []
  - id: professor
    type: TALK_TO_NPC
    title: 拜访北侧的林教授
    target: professor
    dependencies:
    - mission
  - id: learn-language
    type: STUDY_LESSON
    title: 学习 Python 与程序设计语言
    dependencies:
    - professor
    activity_id: ch2-lesson
    activity_version: 1
  - id: choose-route
    type: PLAY_DIALOGUE
    title: 选择概念或编程路线
    target: professor
    dependencies:
    - learn-language
    dialogue_id: language
    choices:
    - id: concept
      label: 辨认程序设计语言
    - id: code
      label: 补学输入输出并编程
  - id: concept-practice
    type: COMPLETE_PRACTICE
    title: 辨认程序设计语言
    dependencies:
    - choose-route
    condition:
      node: choose-route
      choice: concept
    activity_id: ch2-concept
    activity_version: 1
  - id: io-study
    type: STUDY_LESSON
    title: 补学输入、输出与圆面积
    dependencies:
    - choose-route
    condition:
      node: choose-route
      choice: code
    activity_id: ch2-io
    activity_version: 1
  - id: code-practice
    type: COMPLETE_PRACTICE
    title: 正式提交圆面积计算
    dependencies:
    - io-study
    activity_id: ch2-code
    activity_version: 1
  - id: meet-librarian
    type: TALK_TO_NPC
    title: 进入图书馆拜访馆员
    target: librarian_doc
    dependencies:
    - concept-practice
    - code-practice
    aggregation: ANY
  - id: read-shelf
    type: INTERACT_OBJECT
    title: 调查西侧书架
    target: library_shelf
    dependencies:
    - concept-practice
    - code-practice
    aggregation: ANY
  - id: report-language
    type: REPORT_BACK
    title: 完成两个目标后向镇长汇报
    target: mayor_py
    dependencies:
    - meet-librarian
    - read-shelf
  effects:
  - type: set_world_flag
    key: language_archive_restored
