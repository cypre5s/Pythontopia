# =============================================================================
# Pythontopia 主机 Nginx 配置（阿里云 ECS · HTTP + HTTPS 公网入口）
# =============================================================================
# 安装位置：/etc/nginx/sites-available/pythontopia.conf
#           软链到 /etc/nginx/sites-enabled/（由 install_release.sh 自动完成，
#           并停用 Ubuntu 自带 default 站点避免 default_server 冲突）。
#
# 拓扑：公网 80/443 → 本机 Nginx → 127.0.0.1:8080（frontend 容器内 nginx）
#       frontend 容器再把 /api/ 等反代到 backend 容器，主机层不直连 backend，
#       保证路由规则只在容器内 nginx 一处维护。80 仅提供 ACME，其余请求跳转到 HTTPS。
# =============================================================================

# 隐藏精确 Nginx 版本；认证入口按来源 IP 限制持续爆破。
server_tokens off;
limit_req_zone $binary_remote_addr zone=pythontopia_auth:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=pythontopia_classroom_join:10m rate=5r/m;

# 上游：frontend 容器（仅绑定回环 8080）。
upstream pythontopia_frontend {
    server 127.0.0.1:8080;
    # 复用到上游的长连接，降低高并发下的握手开销。
    keepalive 32;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name 47.120.29.62 _;

    # Let’s Encrypt HTTP-01 renewal must remain reachable over port 80.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    # Use the certificate's canonical IP to avoid an attacker-controlled Host redirect.
    location / {
        return 308 https://47.120.29.62$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;

    # Let’s Encrypt 为公网 IPv4 签发的可信短期证书（Certbot systemd timer 自动续期）。
    ssl_certificate     /etc/letsencrypt/live/47.120.29.62/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/47.120.29.62/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:PYTHONTOPIA_TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # 公网按 IP 访问，同时兜底任意 Host。
    server_name 47.120.29.62 _;

    access_log /var/log/nginx/pythontopia.access.log pythontopia_safe;
    error_log  /var/log/nginx/pythontopia.error.log;

    # 上传上限：覆盖语音输入（multipart 最大 12MB）等场景并留余量。
    client_max_body_size 32m;

    # 安全响应头（加固）：防 MIME 嗅探 / 点击劫持 / 限制 Referer 泄露。
    # SPA 文档的完整 CSP 由 frontend Nginx 在 /index.html 响应设置。
    # 此边缘入口保留 X-Frame-Options，覆盖下载门等非 SPA 响应。
    # nginx 约定：location 内若再写 add_header 会覆盖此处继承，故各 location 均不自定义 add_header。
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "0" always;

    # HTTPS health check for the full frontend proxy chain.
    location = /healthz {
        access_log off;
        proxy_pass http://pythontopia_frontend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
    }

    # 登录/注册会触发密码哈希或写库，单独限制突发请求；正常交互不受影响。
    location ~ ^/api/auth/(login|register)$ {
        limit_req zone=pythontopia_auth burst=10 nodelay;
        limit_req_status 429;

        proxy_pass http://pythontopia_frontend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # 生产公网不暴露 API 枚举与交互式文档。
    location = /v3/api-docs { return 404; }
    location ^~ /v3/api-docs/ { return 404; }
    location = /swagger-ui.html { return 404; }
    location ^~ /swagger-ui/ { return 404; }

    # Join codes are low-entropy capabilities; throttle guesses at the public edge.
    location = /api/classrooms/join {
        limit_req zone=pythontopia_classroom_join burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://pythontopia_frontend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # API（含 SSE 流式端点：导师答疑 / 课堂直播 / 媒体合成进度等）。
    # 流式响应必须禁用代理缓冲，否则事件会被攒批延迟甚至断流。
    location /api/ {
        proxy_pass http://pythontopia_frontend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        # SSE 长连接：读超时放宽到 1 小时，写超时 5 分钟。
        proxy_read_timeout 3600s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 5s;
    }

    # 原生客户端安装包：未验证时跳转验证码门控；验证后由 download-gate 一次性 token 直出。
    location = /download-gate {
        return 302 /download-gate/?$args;
    }

    location /download-gate/ {
        root /opt/pythontopia;
        index index.html;
        try_files $uri $uri/ /download-gate/index.html;
    }

    location /download-gate/api/ {
        proxy_pass http://127.0.0.1:9191/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location /download-gate/deliver {
        proxy_pass http://127.0.0.1:9191/deliver;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_connect_timeout 3s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location ~ ^/downloads/(pythontopia(?:-windows\.(?:exe|zip)|\.apk))$ {
        return 302 /download-gate/?file=$1;
    }

    # 其它 /downloads/ 路径（README 等）仍只读目录直出。
    location /downloads/ {
        alias /opt/pythontopia/downloads/;
        autoindex off;
        access_log off;
    }

    # 其余流量（前端静态资源等）：常规代理，保留缓冲。
    location / {
        proxy_pass http://pythontopia_frontend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }
}
