# =============================================================================
# Pythontopia 主机 Nginx 配置（阿里云 ECS · 唯一公网入口 http://47.120.29.62）
# =============================================================================
# 安装位置：/etc/nginx/sites-available/pythontopia.conf
#           软链到 /etc/nginx/sites-enabled/（由 install_release.sh 自动完成，
#           并停用 Ubuntu 自带 default 站点避免 default_server 冲突）。
#
# 拓扑：公网 80 → 本机 Nginx → 127.0.0.1:8080（frontend 容器内 nginx）
#       frontend 容器再把 /api/ 等反代到 backend 容器，主机层不直连 backend，
#       保证路由规则只在容器内 nginx 一处维护。
# =============================================================================

# 上游：frontend 容器（仅绑定回环 8080）。
upstream pythontopia_frontend {
    server 127.0.0.1:8080;
    # 复用到上游的长连接，降低高并发下的握手开销。
    keepalive 32;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    # 公网按 IP 访问，同时兜底任意 Host。
    server_name 47.120.29.62 _;

    access_log /var/log/nginx/pythontopia.access.log;
    error_log  /var/log/nginx/pythontopia.error.log;

    # 上传上限：覆盖语音输入（multipart 最大 12MB）等场景并留余量。
    client_max_body_size 32m;

    # 安全响应头（加固）：防 MIME 嗅探 / 点击劫持 / 限制 Referer 泄露。
    # 站点为 HTTP（仅 80）未配 HTTPS，故不加 HSTS；CSP 仅限制 frame-ancestors（防本站被他人内嵌），
    # 不限制 script/style/connect，避免破坏 Pyodide(wasm-eval) / Phaser / B站视频内嵌等运行时。
    # nginx 约定：location 内若再写 add_header 会覆盖此处继承，故各 location 均不自定义 add_header。
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "frame-ancestors 'self'" always;
    add_header X-XSS-Protection "0" always;

    # 健康检查入口：公网/本机皆可 curl http://<host>/healthz 验证整条链路。
    location = /healthz {
        access_log off;
        proxy_pass http://pythontopia_frontend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
    }

    # API（含 SSE 流式端点：导师答疑 / 课堂直播 / 媒体合成进度等）。
    # 流式响应必须禁用代理缓冲，否则事件会被攒批延迟甚至断流。
    location /api/ {
        proxy_pass http://pythontopia_frontend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        # SSE 长连接：读超时放宽到 1 小时，写超时 5 分钟。
        proxy_read_timeout 3600s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 5s;
    }

    # 原生客户端安装包（Android APK / Windows EXE）：从主机持久目录直出。
    # 大二进制不进 git / 不进镜像、跨版本部署持久；把对应文件名放入
    # /opt/pythontopia/shared/downloads/ 即生效（继承上面的安全响应头；.apk/.exe 浏览器自动下载）。
    location /downloads/ {
        # 独立于 700 权限的 shared/（含 .env 秘密），用 755 目录让 nginx www-data 可读。
        alias /opt/pythontopia/downloads/;
        autoindex off;
        access_log off;
    }

    # 其余流量（前端静态资源、/swagger-ui/、/v3/api-docs 等）：常规代理，保留缓冲。
    location / {
        proxy_pass http://pythontopia_frontend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }
}
