# TTS 覆盖层：不放进默认 compose，只有显式开 profile 才启动。
#
#   docker compose -f deploy/compose.yml -f deploy/compose.tts.yml --profile tts up -d tts
#
# 依赖 deploy/.env 里的 REBORN_TTS_TOKEN（>=24 字符，随机生成）。
# 注意：不发布任何宿主端口，只有同一 compose 网络里的 api 能访问 http://tts:1919。
name: pythontopia-reborn

services:
  tts:
    profiles: [tts]
    image: pythontopia-reborn-tts:local
    environment:
      ZONOS3_ACCESS_TOKEN: ${REBORN_TTS_TOKEN:?set REBORN_TTS_TOKEN in deploy/.env}
    volumes:
      - ${REBORN_TTS_MODELS_DIR:-/srv/pythontopia-tts/models}:/models:ro
    # 共享机：硬限制，避免模型加载峰值影响别人的容器；本机无 swap。
    mem_limit: 4g
    memswap_limit: 4g
    cpus: 8
    pids_limit: 128
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=256m,mode=1777
    restart: unless-stopped
    networks: [default]
    logging: {driver: json-file, options: {max-size: 10m, max-file: "3"}}
