name: pythontopia-reborn
services:
  db:
    image: postgres:17-bookworm@sha256:858bb5e98eed02eb8cafbcdc007f9a65d1b613972028944a8ec2133ccaf80d27
    environment:
      POSTGRES_DB: reborn
      POSTGRES_USER: reborn
      POSTGRES_PASSWORD: ${REBORN_DB_PASSWORD:?set REBORN_DB_PASSWORD in deploy/.env}
    volumes:
      - reborn-db:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U reborn -d reborn]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    environment:
      REBORN_DATABASE_URL: postgresql+psycopg://reborn:${REBORN_DB_PASSWORD}@db:5432/reborn
      REBORN_ENV: production
      REBORN_ADMIN_STUDENT_ID: ${REBORN_ADMIN_STUDENT_ID:-}
      REBORN_ADMIN_PASSWORD: ${REBORN_ADMIN_PASSWORD:-}
      REBORN_ADMIN_NAME: ${REBORN_ADMIN_NAME:-管理员}
      REBORN_STORAGE_ROOT: /app/storage
      REBORN_COURSE_EXCHANGE_ROOT: /app/data/course
      REBORN_AI_API_KEY: ${REBORN_AI_API_KEY:-}
      REBORN_AI_BASE_URL: ${REBORN_AI_BASE_URL:-}
      REBORN_AI_MODEL: ${REBORN_AI_MODEL:-}
      REBORN_AI_REASONING_EFFORT: ${REBORN_AI_REASONING_EFFORT:-}
      REBORN_JUDGE0_URL: ${REBORN_JUDGE0_URL:-}
      REBORN_JUDGE0_AUTH_TOKEN: ${REBORN_JUDGE0_AUTH_TOKEN:-}
      # 存储：不传的话文档里的 S3 开关在 Compose 下完全无效。
      REBORN_STORAGE: ${REBORN_STORAGE:-local}
      REBORN_S3_ENDPOINT: ${REBORN_S3_ENDPOINT:-}
      REBORN_S3_BUCKET: ${REBORN_S3_BUCKET:-}
      REBORN_S3_PREFIX: ${REBORN_S3_PREFIX:-reborn/}
      # 生产必须保持为空；即使误填，REBORN_ENV=production 也不会开启开发工具。
      REBORN_DEV_TOOLS: ${REBORN_DEV_TOOLS:-}
      REBORN_CONVERTER_URL: ${REBORN_CONVERTER_URL:-}
      REBORN_CONVERTER_TOKEN: ${REBORN_CONVERTER_TOKEN:-}
      REBORN_AUTHORING_AI_API_KEY: ${REBORN_AUTHORING_AI_API_KEY:-}
      REBORN_AUTHORING_AI_BASE_URL: ${REBORN_AUTHORING_AI_BASE_URL:-}
      REBORN_AUTHORING_AI_MODEL: ${REBORN_AUTHORING_AI_MODEL:-}
      REBORN_AUTHORING_AI_VISION_MODEL: ${REBORN_AUTHORING_AI_VISION_MODEL:-}
      REBORN_AUTHORING_AI_EFFORT: ${REBORN_AUTHORING_AI_EFFORT:-}
      REBORN_AUTHORING_AI_MAX_TOKENS: ${REBORN_AUTHORING_AI_MAX_TOKENS:-}
      REBORN_AUTHORING_AI_TIMEOUT_SECONDS: ${REBORN_AUTHORING_AI_TIMEOUT_SECONDS:-}
      REBORN_AUTHORING_AI_DAILY_PAGES: ${REBORN_AUTHORING_AI_DAILY_PAGES:-}
      REBORN_NARRATION_ASK_DAILY: ${REBORN_NARRATION_ASK_DAILY:-}
      REBORN_TTS_BASE_URL: ${REBORN_TTS_BASE_URL:-}
      REBORN_TTS_API_KEY: ${REBORN_TTS_API_KEY:-}
      REBORN_TTS_MODEL: ${REBORN_TTS_MODEL:-}
      REBORN_TTS_VOICE: ${REBORN_TTS_VOICE:-}
      REBORN_TTS_FORMAT: ${REBORN_TTS_FORMAT:-}
      REBORN_TTS_SPEED: ${REBORN_TTS_SPEED:-}
      REBORN_TTS_TIMEOUT_SECONDS: ${REBORN_TTS_TIMEOUT_SECONDS:-}
    ports:
      - 127.0.0.1:${REBORN_API_PORT:-18081}:8000
    volumes:
      - reborn-storage:/app/storage
      - ${REBORN_COURSE_EXCHANGE_DIR:-../data/course}:/app/data/course
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks: [default, conversion]
    logging: {driver: json-file, options: {max-size: 10m, max-file: "3"}}
  web:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
      args:
        VITE_TIME_ZONE: ${REBORN_TIME_ZONE:-Asia/Shanghai}
    ports:
      - 127.0.0.1:${REBORN_WEB_PORT:-15174}:80
    depends_on: [api]
    restart: unless-stopped
    logging: {driver: json-file, options: {max-size: 10m, max-file: "3"}}
  converter:
    profiles: [documents]
    build:
      context: ./converter
    image: pythontopia-reborn-converter:local
    environment:
      REBORN_CONVERTER_TOKEN: ${REBORN_CONVERTER_TOKEN:-}
    read_only: true
    tmpfs:
      - /work:rw,nosuid,nodev,size=512m,mode=1777
      - /tmp:rw,nosuid,nodev,size=64m,mode=1777
    mem_limit: 512m
    cpus: 1
    pids_limit: 64
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [conversion]
    restart: unless-stopped
networks:
  conversion:
    internal: true
volumes:
  reborn-db:
  reborn-storage:
