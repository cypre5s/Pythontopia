services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: pythontopia
      POSTGRES_USER: ${PYT_DB_USERNAME:-pytopia}
      POSTGRES_PASSWORD: ${PYT_DB_PASSWORD:-pytopia_dev_password}
    ports:
      - "15432:5432"
    volumes:
      - pytopia_pg:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: pythontopia-backend:dev
    build:
      context: ../backend
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PYT_DB_URL: jdbc:postgresql://postgres:5432/pythontopia
      PYT_DB_USERNAME: ${PYT_DB_USERNAME:-pytopia}
      PYT_DB_PASSWORD: ${PYT_DB_PASSWORD:-pytopia_dev_password}
      PYT_JWT_SECRET: ${PYT_JWT_SECRET:-replace-with-32-char-secret-please}
      PYT_TEACHER_INVITE_CODE: ${PYT_TEACHER_INVITE_CODE:-pytopia-teacher}
      PYTHONTOPIA_SERVICES_GRAPHURL: http://pythontopia-graph:18091
      PYTHONTOPIA_SERVICES_RAGURL: http://pythontopia-rag:18092
      PYTHONTOPIA_SERVICES_RAGADMINTOKEN: ${PYT_RAG_ADMIN_TOKEN:-pytopia-rag-admin}
      JAVA_OPTS: -XX:MaxRAMPercentage=70
    ports:
      - "127.0.0.1:18080:18080"

  pythontopia-graph:
    image: pythontopia-graph:dev
    build:
      context: ../services/pythontopia-graph
      dockerfile: Dockerfile
    # R-13 §5 Phase 6 续：开发态把 host 源码 mount 进 /app，
    # 容器内 sys.path 优先 /app/pythontopia_graph，因此 hot reload 走这里；
    # site-packages 也保留原 wheel（pyproject 依赖照常工作）。
    volumes:
      - ../services/pythontopia-graph/pythontopia_graph:/app/pythontopia_graph:ro
    environment:
      PYT_LLM_PROVIDER: ${PYT_LLM_PROVIDER:-dryrun}
      PYT_OPENAI_BASE_URL: ${PYT_OPENAI_BASE_URL:-}
      PYT_OPENAI_API_KEY: ${PYT_OPENAI_API_KEY:-}
      PYT_OPENAI_MODEL: ${PYT_OPENAI_MODEL:-}
      # R-13：OpenAiCompatProvider 读取无前缀的 OPENAI_*/LLM_* env，
      # 这里把带 PYT_ 前缀的容器入口映射成 provider 期望的形态，
      # 同时保留 Alethicode .env 加载兜底（见 provider.load_alethicode_env）。
      OPENAI_BASE_URL: ${PYT_OPENAI_BASE_URL:-}
      OPENAI_API_KEY: ${PYT_OPENAI_API_KEY:-}
      OPENAI_MODEL: ${PYT_OPENAI_MODEL:-}
      LLM_BASE_URL: ${PYT_OPENAI_BASE_URL:-}
      LLM_API_KEY: ${PYT_OPENAI_API_KEY:-}
      LLM_MODEL: ${PYT_OPENAI_MODEL:-}
      PYT_SPARK_APP_ID: ${PYT_SPARK_APP_ID:-}
      PYT_SPARK_API_KEY: ${PYT_SPARK_API_KEY:-}
      PYT_SPARK_API_SECRET: ${PYT_SPARK_API_SECRET:-}
      PYT_SPARK_MODEL_ID: ${PYT_SPARK_MODEL_ID:-}
      PYT_RAG_URL: http://pythontopia-rag:18092
      NO_PROXY: localhost,127.0.0.1,pythontopia-rag,postgres,redis
      no_proxy: localhost,127.0.0.1,pythontopia-rag,postgres,redis
    ports:
      - "127.0.0.1:18091:18091"

  pythontopia-rag:
    image: pythontopia-rag:dev
    build:
      context: ../services/pythontopia-rag
      dockerfile: Dockerfile
    environment:
      PYT_DB_URL: postgresql://${PYT_DB_USERNAME:-pytopia}:${PYT_DB_PASSWORD:-pytopia_dev_password}@postgres:5432/pythontopia
      PYT_RAG_ADMIN_TOKEN: ${PYT_RAG_ADMIN_TOKEN:-pytopia-rag-admin}
      PYT_RAG_EMBEDDER: ${PYT_RAG_EMBEDDER:-hash}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:18092:18092"

  frontend:
    image: pythontopia-frontend:dev
    build:
      context: ../frontend
      dockerfile: Dockerfile
    depends_on:
      backend:
        condition: service_started
    ports:
      - "8080:80"

volumes:
  pytopia_pg:
