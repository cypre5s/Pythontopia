server {
  listen 80;
  root /usr/share/nginx/html;
  # 128 MiB file limit plus multipart framing; API enforces the file byte limit.
  client_max_body_size 129m;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy same-origin always;
  location /api/ {
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_buffering off;
    proxy_read_timeout 90s;
  }
  location ~ ^/api/teacher/classrooms/[0-9]+/course/imports/preview$ {
    # Course archives have a separate 2 GiB API limit; ordinary uploads stay 128 MiB.
    client_max_body_size 2049m;
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_http_version 1.1;
    proxy_request_buffering off;
    proxy_read_timeout 300s;
  }
  location ~ ^/api/teacher/classrooms/[0-9]+/course/(export|imports/[^/]+/apply)$ {
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_buffering off;
    proxy_read_timeout 300s;
  }
  location = /teacher { return 308 /teacher/$is_args$args; }
  location /teacher/assets/ { try_files $uri =404; }
  location /teacher/ { try_files $uri $uri/ /teacher/index.html; }
  location /assets/ { try_files $uri =404; }
  location ~ ^/assets/.*\.mjs$ {
    types { application/javascript mjs; }
    try_files $uri =404;
  }
  location / { try_files $uri $uri/ /index.html; }
}
